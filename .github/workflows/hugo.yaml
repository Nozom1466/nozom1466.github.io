name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Avoid the busiest top-of-hour window. GitHub may delay scheduled jobs.
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: 0.152.0
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Moments renderer and COS reader
        run: |
          node scripts/moments-render.test.mjs
          node --test scripts/moments-cos.test.mjs scripts/snapnote-blog/*.test.mjs
      - name: Read blog notes from COS
        id: sync
        run: node scripts/snapnote-blog/sync.mjs
      - name: Read Pages configuration
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Hugo CLI
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Build with Hugo
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Check site navigation
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: node scripts/test-navigation.mjs public
      - name: Disable Jekyll processing
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: touch public/.nojekyll
      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
